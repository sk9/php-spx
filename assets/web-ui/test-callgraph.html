<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SPX Call Graph Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #111;
            color: #089;
        }
        h1 {
            color: #0ff;
        }
        #test-results {
            margin-top: 20px;
        }
        .test {
            margin: 10px 0;
            padding: 10px;
            background: #222;
            border-left: 3px solid #444;
        }
        .test.pass {
            border-color: #0f0;
        }
        .test.fail {
            border-color: #f00;
        }
        .test-name {
            font-weight: bold;
            color: #fff;
        }
        .test-details {
            margin-left: 20px;
            margin-top: 5px;
            color: #aaa;
        }
        pre {
            background: #000;
            padding: 10px;
            overflow-x: auto;
            color: #0f0;
        }
    </style>
</head>
<body>
    <h1>SPX Call Graph Infrastructure Test</h1>
    <p>Testing Phase 1 implementation: Core infrastructure</p>

    <div id="test-results">
        <p>Running tests...</p>
    </div>

    <script type="module">
        function getImportUrl(path) {
            const rootUrl = new URL(import.meta.url);
            rootUrl.searchParams.set('SPX_UI_URI', path);
            return rootUrl.toString();
        }

        const math = await import(getImportUrl('/js/math.js'));
        const utils = await import(getImportUrl('/js/utils.js'));
        const svg = await import(getImportUrl('/js/svg.js'));
        const callGraph = await import(getImportUrl('/js/callGraph.js'));
        const layouts = await import(getImportUrl('/js/layouts.js'));

        const results = [];

        function runTest(name, testFn) {
            try {
                const result = testFn();
                results.push({
                    name,
                    pass: true,
                    details: result
                });
            } catch (e) {
                results.push({
                    name,
                    pass: false,
                    details: e.message,
                    error: e
                });
            }
        }

        // Test 1: Module imports
        runTest('Module Imports', () => {
            if (!math) throw new Error('math module not loaded');
            if (!utils) throw new Error('utils module not loaded');
            if (!svg) throw new Error('svg module not loaded');
            if (!callGraph) throw new Error('callGraph module not loaded');
            if (!layouts) throw new Error('layouts module not loaded');
            return 'All modules loaded successfully';
        });

        // Test 2: CallGraphNode creation
        runTest('CallGraphNode Creation', () => {
            const mockCallTreeNode = {
                getFunctionName: () => 'test_function',
                getDepth: () => 1,
                getCalled: () => 10,
                getInc: () => ({
                    getValue: (m) => 100
                }),
                getMaxCumInc: () => ({
                    getValue: (m) => 100
                }),
                getChildren: () => []
            };

            const node = new callGraph.CallGraphNode(mockCallTreeNode);

            if (node.getFunctionName() !== 'test_function') {
                throw new Error('Function name mismatch');
            }
            if (node.getDepth() !== 1) {
                throw new Error('Depth mismatch');
            }
            if (node.getCalled() !== 10) {
                throw new Error('Called count mismatch');
            }

            return `Created CallGraphNode: ${node.getFunctionName()} (depth: ${node.getDepth()}, calls: ${node.getCalled()})`;
        });

        // Test 3: CallGraphEdge creation
        runTest('CallGraphEdge Creation', () => {
            const mockFrom = {
                getFunctionName: () => 'parent_function'
            };
            const mockTo = {
                getFunctionName: () => 'child_function'
            };

            const edge = new callGraph.CallGraphEdge(mockFrom, mockTo, 5, null);

            if (edge.callCount !== 5) {
                throw new Error('Call count mismatch');
            }
            if (edge.from !== mockFrom) {
                throw new Error('From node mismatch');
            }
            if (edge.to !== mockTo) {
                throw new Error('To node mismatch');
            }

            return `Created CallGraphEdge: ${mockFrom.getFunctionName()} -> ${mockTo.getFunctionName()} (calls: ${edge.callCount})`;
        });

        // Test 4: SVG utilities
        runTest('SVG Utilities', () => {
            const node = svg.createNode('rect', {
                x: 10,
                y: 20,
                width: 100,
                height: 50,
                fill: '#f00'
            });

            if (node.tagName !== 'rect') {
                throw new Error('Wrong element type');
            }
            if (node.getAttribute('x') !== '10') {
                throw new Error('Wrong x attribute');
            }
            if (node.getAttribute('fill') !== '#f00') {
                throw new Error('Wrong fill attribute');
            }

            return `Created SVG rect element with correct attributes`;
        });

        // Test 5: NodePool functionality
        runTest('NodePool Functionality', () => {
            const pool = new svg.NodePool('circle');

            const node1 = pool.acquire({ cx: 10, cy: 10, r: 5 });
            const node2 = pool.acquire({ cx: 20, cy: 20, r: 5 });

            if (pool.top !== 2) {
                throw new Error('Pool top should be 2');
            }

            pool.releaseAll();

            if (pool.top !== 0) {
                throw new Error('Pool should be empty after releaseAll');
            }

            const node3 = pool.acquire({ cx: 30, cy: 30, r: 5 });

            if (pool.top !== 1) {
                throw new Error('Pool top should be 1 after reuse');
            }

            return `NodePool correctly manages ${pool.nodes.length} nodes`;
        });

        // Test 6: Arrowhead markers
        runTest('Arrowhead Markers', () => {
            const svgElement = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.createArrowheadMarkers(svgElement);

            const defs = svgElement.querySelector('defs');
            if (!defs) {
                throw new Error('No defs element created');
            }

            const arrowhead = defs.querySelector('#arrowhead');
            const arrowheadHot = defs.querySelector('#arrowhead-hot');
            const arrowheadHighlight = defs.querySelector('#arrowhead-highlight');

            if (!arrowhead || !arrowheadHot || !arrowheadHighlight) {
                throw new Error('Not all arrowhead markers created');
            }

            return `Created 3 arrowhead marker definitions`;
        });

        // Test 7: Math utilities
        runTest('Math Utilities', () => {
            const lerped = math.lerp(0, 100, 0.5);
            if (Math.abs(lerped - 50) > 0.001) {
                throw new Error('lerp failed');
            }

            const vec1 = new math.Vec3(1, 0, 0);
            const vec2 = new math.Vec3(0, 1, 0);
            const interpolated = math.Vec3.lerp(vec1, vec2, 0.5);

            if (Math.abs(interpolated.x - 0.5) > 0.001 ||
                Math.abs(interpolated.y - 0.5) > 0.001) {
                throw new Error('Vec3 lerp failed');
            }

            const color = vec1.toHTMLColor();
            if (!color.startsWith('rgb(')) {
                throw new Error('toHTMLColor failed');
            }

            return `Math utilities working correctly`;
        });

        // Test 8: Layout algorithms
        runTest('HierarchicalLayout', () => {
            // Create mock graph data
            const mockNode1 = {
                getFunctionName: () => 'root',
                getDepth: () => 0,
                getInclusiveMetric: () => 100,
                layout: {}
            };

            const mockNode2 = {
                getFunctionName: () => 'child',
                getDepth: () => 1,
                getInclusiveMetric: () => 50,
                layout: {}
            };

            const mockGraphData = {
                nodes: new Map([
                    ['root', mockNode1],
                    ['child', mockNode2]
                ]),
                currentMetric: 'wt'
            };

            const layout = new layouts.HierarchicalLayout(mockGraphData, {
                viewportWidth: 1000,
                viewportHeight: 800
            });

            layout.compute();

            if (mockNode1.layout.x === undefined || mockNode1.layout.y === undefined) {
                throw new Error('Layout did not assign coordinates');
            }

            if (mockNode1.layout.y >= mockNode2.layout.y) {
                throw new Error('Parent should be above child');
            }

            const dims = layout.getDimensions();

            return `Layout computed: ${mockGraphData.nodes.size} nodes, dimensions: ${Math.round(dims.width)}x${Math.round(dims.height)}`;
        });

        // Test 9: Sugiyama layout
        runTest('SugiyamaLayout', () => {
            // Create mock graph data
            const mockNode1 = {
                getFunctionName: () => 'root',
                getDepth: () => 0,
                getInclusiveMetric: () => 100,
                parents: [],
                children: [],
                layout: {}
            };

            const mockNode2 = {
                getFunctionName: () => 'child',
                getDepth: () => 1,
                getInclusiveMetric: () => 50,
                parents: [mockNode1],
                children: [],
                layout: {}
            };

            mockNode1.children = [mockNode2];

            const mockGraphData = {
                nodes: new Map([
                    ['root', mockNode1],
                    ['child', mockNode2]
                ]),
                rootNodes: [mockNode1],
                currentMetric: 'wt'
            };

            const layout = new layouts.SugiyamaLayout(mockGraphData, {
                viewportWidth: 1000
            });

            layout.compute();

            if (mockNode1.layout.x === undefined || mockNode1.layout.y === undefined) {
                throw new Error('Layout did not assign coordinates');
            }

            return `Sugiyama layout computed with crossing minimization`;
        });

        // Test 10: Force-directed layout
        runTest('ForceDirectedLayout', () => {
            const mockNode1 = {
                getFunctionName: () => 'node1',
                layout: {},
                velocity: {}
            };

            const mockNode2 = {
                getFunctionName: () => 'node2',
                layout: {},
                velocity: {}
            };

            const mockEdge = {
                from: mockNode1,
                to: mockNode2
            };

            const mockGraphData = {
                nodes: new Map([
                    ['node1', mockNode1],
                    ['node2', mockNode2]
                ]),
                edges: new Map([
                    ['node1->node2', mockEdge]
                ])
            };

            const layout = new layouts.ForceDirectedLayout(mockGraphData, {
                iterations: 10,
                viewportWidth: 1000,
                viewportHeight: 800
            });

            layout.compute();

            if (mockNode1.layout.x === undefined || mockNode1.layout.y === undefined) {
                throw new Error('Layout did not assign coordinates');
            }

            return `Force-directed layout converged after 10 iterations`;
        });

        // Render results
        const container = document.getElementById('test-results');
        container.innerHTML = '';

        const summary = document.createElement('div');
        const passCount = results.filter(r => r.pass).length;
        const failCount = results.filter(r => !r.pass).length;

        summary.innerHTML = `
            <h2>Test Results: ${passCount}/${results.length} passed</h2>
            <p style="color: ${failCount === 0 ? '#0f0' : '#f00'}">
                ✓ ${passCount} passed, ✗ ${failCount} failed
            </p>
        `;
        container.appendChild(summary);

        for (const result of results) {
            const testDiv = document.createElement('div');
            testDiv.className = `test ${result.pass ? 'pass' : 'fail'}`;

            testDiv.innerHTML = `
                <div class="test-name">
                    ${result.pass ? '✓' : '✗'} ${result.name}
                </div>
                <div class="test-details">
                    ${result.pass ? result.details : 'ERROR: ' + result.details}
                </div>
            `;

            container.appendChild(testDiv);
        }

        // Show summary statistics
        const stats = document.createElement('pre');
        stats.textContent = `
Infrastructure Test Summary
===========================
Total Tests: ${results.length}
Passed: ${passCount}
Failed: ${failCount}
Success Rate: ${Math.round((passCount / results.length) * 100)}%

Phase 1 Components Tested:
- callGraph.js (CallGraphNode, CallGraphEdge, CallGraphData)
- layouts.js (HierarchicalLayout, SugiyamaLayout, ForceDirectedLayout)
- svg.js (NodePool, createArrowheadMarkers)
- math.js (lerp, Vec3)
`;
        container.appendChild(stats);

        console.log('✓ Phase 1 infrastructure tests complete');
        console.log(`Results: ${passCount}/${results.length} passed`);
    </script>
</body>
</html>
